# Lihat docs/09-deployment.md §1.
# Demo Fase 0: `docker compose up --build` → http://localhost:5173 (web) & :8080/health (API).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: transcribe
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d transcribe"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dev
      MINIO_ROOT_PASSWORD: devdevdev
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # Buat bucket 'audio' sekali saja (object storage dipakai mulai Fase 2).
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 dev devdevdev; do sleep 1; done;
      mc mb --ignore-existing local/audio;
      echo 'bucket audio siap';
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://app:dev@postgres:5432/transcribe
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: audio
      S3_ACCESS_KEY: dev
      S3_SECRET_KEY: devdevdev
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-hanya-untuk-dev-lokal-32b!}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      RUST_LOG: info,transcribe_api=debug
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      # Di dalam jaringan compose, SSR memanggil API lewat hostname 'api'.
      PUBLIC_API_URL: http://api:8080/api/v1
    depends_on:
      - api
    ports:
      - "5173:3000"

volumes:
  pgdata: {}
  miniodata: {}
