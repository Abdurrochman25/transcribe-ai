# Fly.io — Web (SvelteKit adapter-node).
# Deploy: `fly deploy --config apps/web/fly.toml` dari root repo.

app = "transcribe-ai-web"
primary_region = "sin"

[build]
	dockerfile = "../Dockerfile.web"

[env]
	PORT = "3000"
	# Sesuaikan dengan domain publik API Anda (tanpa trailing slash).
	PUBLIC_API_URL = "https://api.transcribeai.example.com/api/v1"
	NODE_ENV = "production"
	ORIGIN = "https://transcribeai.example.com"

[http_service]
	internal_port = 3000
	force_https = true
	auto_stop_machines = true
	auto_start_machines = true
	min_machines_running = 0

	[[http_service.checks]]
		interval = "15s"
		timeout = "3s"
		[[http_service.checks.requests]]
			method = "GET"
			path = "/login"
