# Fly.io — API (Rust/Axum).
# Deploy: `fly deploy --config apps/api/fly.toml --dockerfile Dockerfile.api`
# (dari root repo; build context = root agar apps/api + Dockerfile.api terbaca).
# Catatan: worker transkripsi berjalan in-process → machine TIDAK boleh
# auto-stop (auto_stop_machines = false), minimal 1 machine jalan.

app = "transcribe-ai-api"
primary_region = "sin"

[build]
	dockerfile = "../Dockerfile.api"

[env]
	PORT = "8080"
	RUST_LOG = "info,tower_http=warn,sqlx=warn"
	COOKIE_SECURE = "true"
	WORKER_CONCURRENCY = "4"

[http_service]
	internal_port = 8080
	force_https = true
	auto_stop_machines = false
	auto_start_machines = true
	min_machines_running = 1

	[http_service.concurrency]
		type = "requests"
		hard_limit = 200
		soft_limit = 150

	[[http_service.checks]]
		interval = "10s"
		timeout = "3s"
		grace_period = "30s"
		[[http_service.checks.requests]]
			method = "GET"
			path = "/health"

[[vm]]
	size = "shared-cpu-2x"
	memory = "1gb"
